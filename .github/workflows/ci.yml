name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make windows
      - uses: actions/upload-artifact@v7
        with:
          name: lowkey-windows
          path: |
            bin/lowkey.exe
            bin/fakeriot.exe
          if-no-files-found: error

  windows-doctor:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lowkey-windows
      - name: lowkey doctor against the fakeriot program
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "fakeriot"
          $fr = Start-Process -FilePath .\fakeriot.exe -ArgumentList "-dir", $dir -PassThru -NoNewWindow
          for ($i = 0; $i -lt 100 -and -not (Test-Path "$dir\fakeriot.env"); $i++) { Start-Sleep -Milliseconds 100 }
          Get-Content "$dir\fakeriot.env" | ForEach-Object {
            $k, $v = $_ -split '=', 2
            Set-Item "env:$k" $v
          }
          $env:LOWKEY_DIR = $dir
          $lines = .\lowkey.exe doctor
          $code = $LASTEXITCODE
          Stop-Process -Id $fr.Id -ErrorAction SilentlyContinue
          $lines
          if ($code -ne 0) { exit $code }
          if (-not ($lines -match '^PASS  priority\s+below normal')) { throw "priority isn't below normal" }
          if (-not ($lines -match '^PASS  efficiency\s+on')) { throw "Efficiency mode isn't on" }
          if (-not ($lines -match '^PASS  console')) { throw "doctor didn't report the console" }
          exit 0
      - name: lowkey looks for the Riot Client's own lockfile without overrides
        shell: pwsh
        run: |
          $lines = .\lowkey.exe doctor
          $lines
          $want = Join-Path $env:LOCALAPPDATA "Riot Games\Riot Client\Config\lockfile"
          if (-not ($lines -match [regex]::Escape($want))) { throw "doctor didn't look for $want" }
          exit 0

  windows-e2e:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: lowkey-windows
          path: artifacts
      - name: scenarios and performance checks against the real lowkey.exe
        shell: pwsh
        run: |
          $env:LOWKEY_EXE = (Resolve-Path artifacts\lowkey.exe).Path
          go test ./tests/e2e -count=1 -v -timeout 15m

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, windows-doctor, windows-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lowkey-windows
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lowkey.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
